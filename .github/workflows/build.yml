name: Build FormulaLab

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Package plugin
        run: |
          mkdir -p dist/formulalab
          cp manifest.json main.js styles.css dist/formulalab/
          cd dist
          zip -r formulalab.zip formulalab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: formulalab
          path: dist/formulalab.zip
